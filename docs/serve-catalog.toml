# Model catalog for `cognitive-mesh serve` (ADR-0038 format, no keys in this file).
# Groq coordinates (the conductor) and can also work; the local llama3.2 is a second worker.
# GROQ_API_KEY comes from the environment or the ignored .env. Groq is a remote service, so start
# the server with COGMESH_ALLOW_REMOTE_CONTENT=true; data_use is YOUR statement, not verified.
#
#   COGMESH_ALLOW_REMOTE_CONTENT=true COGMESH_ALLOW_TRAINING_USE=true \
#     uv run cognitive-mesh serve --home cogmesh-home --catalog docs/serve-catalog.toml --conductor groq

[models.groq]
wire = "openai_compatible"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
context_tokens = 131072
tier = "free"
data_use = "unknown"
roles = ["conductor", "planner", "coder", "code_explainer", "dependency_analyst", "reader"]

[models.gemini]
wire = "openai_compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"
context_tokens = 1048576
tier = "free"
data_use = "may_train"
roles = ["conductor", "planner", "coder", "code_explainer", "dependency_analyst", "reader"]

[models.local-llama]
wire = "ollama"
base_url = "http://localhost:11434"
model = "llama3.2"
context_tokens = 131072
tier = "free"
data_use = "no_training"
roles = ["code_explainer", "reader"]
