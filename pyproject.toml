[project]
name = "cognitive-mesh"
version = "0.1.0"
description = "Application-aware, evidence-aware AI agent system with persistent cross-session memory."
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.7",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
cognitive-mesh = "cognitive_mesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_mesh"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-networkx>=3.6.1.20261006",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
