# git-cliff configuration. Regenerate with: uv run git-cliff -o CHANGELOG.md
# Sections come from Conventional Commits; versions come from v* tags.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Format follows Keep a Changelog. Generated from Conventional Commits by git-cliff; \
do not hand-edit. Regenerate with `uv run git-cliff -o CHANGELOG.md`.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false

commit_parsers = [
    { message = "^Merge", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore\\(changelog\\)", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^(refactor|perf)", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^(build|ci|chore|test|style)", group = "Maintenance" },
]
