# Generic CI pipeline. Runs on every push and PR to main, and can be triggered
# manually from the Actions tab (workflow_dispatch).
#
# HOW TO CONFIGURE FOR YOUR PROJECT
# ---------------------------------
# Everything you normally need to change lives in the "CONFIG" section below:
#   - os / python-version: edit the matrix (add "windows-latest", "3.12", etc.)
#   - INSTALL_CMD / LINT_CMD / FORMAT_CMD / TEST_CMD: set to your project's
#     commands from tech-stack.md (npm, cargo, pytest, etc.)
#   - RUN_SECRET_SCAN: set to "true" to enable the gitleaks secret scan step
#
# HOW TO EXTEND
# -------------
# Add extra steps inside the job below (e.g. build, type-check, deploy).
# Keep the trigger/job/checkout structure as-is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # --- CONFIG: OS + Python versions (add/remove entries as needed) ---
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    # --- CONFIG: commands for your stack (from tech-stack.md) ---
    env:
      # Tooling is not finalized (see memory-bank/tech-stack.md). Update these when it is.
      # Dev tools are installed explicitly; project deps are installed if a manifest exists.
      INSTALL_CMD: >-
        python -m pip install --upgrade pip ruff black pytest &&
        if [ -f requirements.txt ]; then pip install -r requirements.txt;
        elif [ -f pyproject.toml ]; then pip install -e .; fi
      LINT_CMD: ruff check .
      FORMAT_CMD: black --check .
      TEST_CMD: pytest
      RUN_SECRET_SCAN: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: ${{ env.INSTALL_CMD }}

      # Pre-implementation guard: skip checks until Python code exists, so CI is not
      # red on a repo with no source. Remove once v0.1.0 lands.
      - name: Detect Python sources
        id: src
        run: |
          if [ -n "$(git ls-files '*.py')" ]; then echo "has_py=true" >> "$GITHUB_OUTPUT"; fi

      - name: Lint
        if: steps.src.outputs.has_py == 'true'
        run: ${{ env.LINT_CMD }}

      - name: Format check
        if: steps.src.outputs.has_py == 'true'
        run: ${{ env.FORMAT_CMD }}

      - name: Run tests
        if: steps.src.outputs.has_py == 'true'
        run: ${{ env.TEST_CMD }}

      # Belt-and-suspenders with GitHub's built-in secret scanning.
      # Enable by setting RUN_SECRET_SCAN to "true" above.
      - name: Secret scan
        if: env.RUN_SECRET_SCAN == 'true'
        uses: gitleaks/gitleaks-action@v2