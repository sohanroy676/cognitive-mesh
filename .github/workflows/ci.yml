# Generic CI pipeline. Runs on every push and PR to main and on v* tag pushes, and can be triggered
# manually from the Actions tab (workflow_dispatch).
#
# HOW TO CONFIGURE FOR YOUR PROJECT
# ---------------------------------
# Things you normally need to change:
#   - os / python-version: edit the matrix (add "windows-latest", "3.12", etc.)
#   - The uv/ruff/mypy/pytest steps below mirror the commands in memory-bank/tech-stack.md.
#   - RUN_SECRET_SCAN: set the repository variable RUN_SECRET_SCAN to "true"
#     (Settings -> Variables) to enable the gitleaks secret scan step
#
# HOW TO EXTEND
# -------------
# Add extra steps inside the job below (e.g. build, type-check, deploy).
# Keep the trigger/job/checkout structure as-is.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # --- CONFIG: OS + Python versions (add/remove entries as needed) ---
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans a commit range, so it needs history

      - name: Set up uv (Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Changelog is up to date
        run: |
          uv run git-cliff -o CHANGELOG.md
          git diff --exit-code CHANGELOG.md || {
            echo "CHANGELOG.md is stale. Run 'uv run git-cliff -o CHANGELOG.md' and commit it as 'chore(changelog): regenerate'."
            exit 1
          }

      - name: Changelog has the release section
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qF "## [${version}] - " CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${version}. Regenerate it with 'uv run git-cliff --tag v${version} -o CHANGELOG.md' before tagging."
            exit 1
          }

      # Belt-and-suspenders with GitHub's built-in secret scanning.
      # Enable by setting the RUN_SECRET_SCAN repository variable to "true".
      - name: Secret scan
        if: ${{ vars.RUN_SECRET_SCAN == 'true' }}
        uses: gitleaks/gitleaks-action@v3